[project]
name = "dwyt-runner"
version = "0.22.0"
description = "dwyt runner: downloads, captions, cloud transcription and summaries on your own machine"
requires-python = ">=3.11,<3.15"  # new Pythons first lack ready-made wheels (brotli for yt-dlp): uv then fetches a fitting one
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "yt-dlp[default,curl-cffi]",   # unpinned on purpose: YouTube changes often
  "imageio-ffmpeg>=0.5",         # a static ffmpeg for Linux, Windows and macOS
  "deno>=2.0",                   # the JavaScript runtime yt-dlp needs for YouTube
  "keyring>=25",                 # secrets in the system key store (Windows Credential Manager, Keychain, Secret Service)
  "cryptography>=42",            # remote settings: keys arrive encrypted with this runner's own RSA key (7d)
  # Intel Macs: cryptography ships x86_64 macOS wheels only up to 48 (49+ would be built from source with Rust)
  "cryptography<49; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
local = ["sherpa-onnx>=1.12", "numpy>=1.26"]  # built-in local transcription: speakers (whisper.cpp is a program)
desktop = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9", "pywebview>=5", "pystray>=0.19", "pillow>=10.1"]  # the window
test = ["pytest>=8", "fastapi>=0.115", "uvicorn>=0.30", "ruff>=0.6", "jinja2>=3.1", "python-multipart>=0.0.9", "pillow>=10", "babel>=2.14"]

[project.scripts]
skipwise-runner = "dwyt_runner.cli:main"
dwyt-runner = "dwyt_runner.cli:main"  # the name before 0.17

[project.gui-scripts]
skipwise-runner-app = "dwyt_runner.app.main:entry"  # no console window (start at login, shortcuts)
dwyt-runner-app = "dwyt_runner.app.main:entry"  # the name before 0.17

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dwyt_runner*"]

[tool.setuptools.package-data]
dwyt_runner = ["data/*.mp3", "app/templates/*.html", "app/static/*", "locale/*.po", "locale/*.pot"]  # test-run sample (public domain), window, translations

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"dwyt_runner/summarize.py" = ["E501"]  # prompt texts
"dwyt_runner/translate.py" = ["E501"]  # prompt texts
"dwyt_runner/settings.py" = ["E501"]  # label and help texts, marked for translation

[tool.pytest.ini_options]
testpaths = ["tests"]
