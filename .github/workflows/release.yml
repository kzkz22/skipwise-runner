# Desktop packages and a signed release (round 7c; plan 15b, decision 18.20).
# A new version in pyproject.toml pushed to main (or a tag vX.Y.Z equal to it) builds the wheel, the Windows installer
# (Authenticode-signed through SignPath when that is set up, decision 19.27) and the Linux AppImage,
# tries each, writes latest.json (version, file names, sizes, SHA-256) and signs it with the project's minisign
# key (Actions secret MINISIGN_SECRET_KEY: the whole minisign.key file, made with `minisign -G -W`). Without the
# secret the release is published unsigned, and runners do not install it. A push touching packaging/ (or a run by
# hand) only builds and tries the packages.
name: release
on:
  push:
    tags: ["v*"]
    # main: a new version in pyproject.toml is released (no tag needed); a packaging change only builds and tries.
    # proba/*: builds and tries the packages before a change goes to main, never publishes
    branches: [main, "proba/**"]
    paths: ["packaging/**", ".github/workflows/release.yml", "pyproject.toml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read  # SignPath's action reads the job and downloads the artifact to sign
jobs:
  wheel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject says $v"; exit 1; }
      - id: v
        name: a new version? (no release of it yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ "${GITHUB_REF#refs/heads/proba/}" != "$GITHUB_REF" ] || gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=no" >> "$GITHUB_OUTPUT"
          else
            echo "release=yes" >> "$GITHUB_OUTPUT"
          fi
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with: {name: wheel, path: dist/*.whl}

  windows:
    needs: wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: {name: wheel, path: dist}
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Authenticode (decision 19.27): with SignPath set up (secret SIGNPATH_API_TOKEN, variable
      # SIGNPATH_ORGANIZATION_ID) a release is signed with SIGNPATH_POLICY (default release-signing, approved by hand
      # in SignPath); other builds only with SIGNPATH_TEST_POLICY (test certificate) if that is set; otherwise unsigned
      - id: sign
        name: sign this build?
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          RELEASE: ${{ needs.wheel.outputs.release }}
          POLICY: ${{ vars.SIGNPATH_POLICY }}
          TEST_POLICY: ${{ vars.SIGNPATH_TEST_POLICY }}
        run: |
          policy=""; test=0
          if [ -n "$TOKEN" ] && [ -n "$ORG" ]; then
            if [ "$RELEASE" = "yes" ]; then policy="${POLICY:-release-signing}"; elif [ -n "$TEST_POLICY" ]; then policy="$TEST_POLICY"; test=1; fi
          fi
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          echo "SIGNPATH_TEST=$test" >> "$GITHUB_ENV"
          echo "signing policy: ${policy:-none (unsigned build)}"
      - run: python packaging/build.py windows-folder
      - if: steps.sign.outputs.policy == ''
        run: python packaging/build.py windows-installer
      - if: steps.sign.outputs.policy != ''
        name: the files to sign (every unsigned EXE, DLL and .pyd, and the uninstaller)
        run: python packaging/build.py windows-tosign
      - if: steps.sign.outputs.policy != ''
        id: tosign
        uses: actions/upload-artifact@v4
        with: {name: windows-tosign, path: build/package/tosign/, retention-days: 3}
      - if: steps.sign.outputs.policy != ''
        name: sign the package files (SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'skipwise-runner' }}
          signing-policy-slug: ${{ steps.sign.outputs.policy }}
          artifact-configuration-slug: package
          github-artifact-id: ${{ steps.tosign.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 14400  # a release waits for the approval in SignPath
          download-signed-artifact-timeout-in-seconds: 1800
          output-artifact-directory: build/package/signed
      - if: steps.sign.outputs.policy != ''
        name: the signed files back in place, then the installer
        run: |
          python packaging/build.py windows-putback build/package/signed
          python packaging/build.py windows-installer --signed-uninstaller
      - if: steps.sign.outputs.policy != ''
        id: setup
        uses: actions/upload-artifact@v4
        with: {name: windows-setup-tosign, path: dist/skipwise-runner-setup-*.exe, retention-days: 3}
      - if: steps.sign.outputs.policy != ''
        name: sign the installer (SignPath)
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092  # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'skipwise-runner' }}
          signing-policy-slug: ${{ steps.sign.outputs.policy }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: build/package/signed-setup
      - if: steps.sign.outputs.policy != ''
        name: the signed installer, and every file checked
        shell: pwsh
        run: |
          Copy-Item build/package/signed-setup/skipwise-runner-setup-*.exe dist/ -Force
          python packaging/build.py windows-verify (Get-ChildItem dist/skipwise-runner-setup-*.exe).FullName build/package/windows
      - name: try it (silent install, the command line, uninstall)
        shell: pwsh
        env:
          SIGNED: ${{ steps.sign.outputs.policy != '' && '1' || '0' }}
        run: |
          function Fail($what) { Write-Output "::error title=Windows package::$what"; exit 1 }
          $setup = Get-ChildItem dist\skipwise-runner-setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOLAUNCH=1","/LOG=$env:RUNNER_TEMP\setup.log" -Wait
          $app = "$env:LOCALAPPDATA\Programs\Skipwise"
          if (-not (Test-Path "$app\python\python.exe")) { Fail ("not installed: " + ((Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 15) -join " | ")) }
          foreach ($cmd in "skipwise-runner", "dwyt-runner") {
            $out = & "$app\bin\$cmd.cmd" --version 2>&1
            if ($LASTEXITCODE -ne 0) { Fail "$cmd.cmd --version: $out" }
          }
          $desc = (Get-Item "$app\python\Skipwise.exe").VersionInfo.FileDescription
          if ($desc -ne "Skipwise futtató") { Fail "Skipwise.exe says: $desc" }
          Start-Process "$app\python\Skipwise.exe" -ArgumentList "-c","open(r'$env:RUNNER_TEMP\probe.txt','w').write('ok')" -Wait
          if ((Get-Content "$env:RUNNER_TEMP\probe.txt") -ne "ok") { Fail "Skipwise.exe does not run Python" }
          Write-Output "version: $out"
          $out = & "$app\python\python.exe" -c "import webview, pystray, sherpa_onnx, dwyt_runner.updater as u; k = u.kind(); print(k); assert k == 'inno', k" 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "imports: $out" }
          # Tesseract for the slides (19c round C): found by the runner, and it runs with its DLLs
          $out = & "$app\python\python.exe" -c "from dwyt_runner import slides; from dwyt_runner.config import Config; t = slides.tesseract(Config()); print(t); assert t and t.endswith('tesseract\\tesseract.exe'), t" 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "Tesseract not found: $out" }
          $out = & "$app\tesseract\tesseract.exe" --version 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "Tesseract does not run: $out" }
          Write-Output "tesseract: $($out | Select-Object -First 1)"
          $out = & "$app\python\python.exe" -m dwyt_runner.app.main --self-test 2>&1
          if ($LASTEXITCODE -ne 0) { Fail "the window app would not start: $out" }
          Write-Output "app: $out"
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "Skipwise*.lnk" | Select-Object -First 1
          if (-not $lnk) { Fail "no Start menu shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk.FullName).TargetPath
          if ($target -notlike "*\Skipwise.exe") { Fail "the shortcut starts $target" }
          if (Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter "dwyt*.lnk") { Fail "the old dwyt shortcut is still there" }
          if ($env:SIGNED -eq "1") {
            foreach ($f in "$app\unins000.exe", "$app\python\Skipwise.exe", "$app\python\python.exe") {
              $st = (Get-AuthenticodeSignature -LiteralPath $f).Status.ToString()
              if ($st -ne "Valid" -and -not ($env:SIGNPATH_TEST -eq "1" -and $st -eq "UnknownError")) { Fail "$f is not signed: $st" }
            }
          }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 5
          if (Test-Path "$app\python") { Fail ("uninstall left: " + ((Get-ChildItem $app | Select-Object -ExpandProperty Name) -join ", ")) }
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: dist/skipwise-runner-setup-*.exe}

  appimage:
    needs: wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with: {name: wheel, path: dist}
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libfuse2
      - run: python3 packaging/build.py appimage
      - name: try it
        run: |
          img=$(ls dist/skipwise-runner-*-x86_64.AppImage)
          "$img" --version
          "$img" config describe | head -3
      - uses: actions/upload-artifact@v4
        with: {name: appimage, path: dist/skipwise-runner-*-x86_64.AppImage}

  publish:
    if: needs.wheel.outputs.release == 'yes'
    needs: [wheel, windows, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: latest.json
        run: python3 packaging/latest_json.py "${{ needs.wheel.outputs.version }}" out > latest.json && mv latest.json out/ && cat out/latest.json
      - name: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then echo "::warning::no MINISIGN_SECRET_KEY: the release is not signed"; exit 0; fi
          sudo apt-get install -y minisign >/dev/null
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m out/latest.json -t "skipwise-runner ${{ needs.wheel.outputs.version }}"
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -V -p packaging/minisign.pub -m out/latest.json
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fixed names too, for the download links (releases/latest/download/...) on the Runners page;
          # the dwyt-runner-* copies for links written before 0.17
          v="${{ needs.wheel.outputs.version }}"
          cp "out/skipwise-runner-setup-$v.exe" out/skipwise-runner-setup.exe
          cp "out/skipwise-runner-$v-x86_64.AppImage" out/skipwise-runner-x86_64.AppImage
          cp "out/skipwise-runner-setup-$v.exe" out/dwyt-runner-setup.exe
          cp "out/skipwise-runner-$v-x86_64.AppImage" out/dwyt-runner-x86_64.AppImage
          gh release create "v$v" out/* --target "$GITHUB_SHA" --title "Skipwise futtató $v" \
            --notes "Windows: skipwise-runner-setup.exe (rendszergazdai jog nélkül). Linux: skipwise-runner-x86_64.AppImage. Szerverre: a Skipwise Futtatók oldalán az egysoros telepítő. A futtató csak a projekt kulcsával aláírt kiadást telepíti magától. Code signing: free code signing provided by SignPath.io, certificate by SignPath Foundation (https://github.com/kzkz22/skipwise-runner/blob/main/docs/code-signing.md)."
